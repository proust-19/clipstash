[package]
name = "clipstash"
version = "0.1.0"
edition = "2021"
description = "A fast, keyboard-first clipboard history manager for Wayland/Linux"
license = "MIT"

[dependencies]
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.29"

